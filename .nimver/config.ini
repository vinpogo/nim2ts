; nimver configuration
; see https://github.com/vinpogo/nimver for details

; How to treat a type that is not listed below. `reject` refuses the commit;
; any bump level accepts it and counts it at that level.
; [commits]
; unknownType = reject

[types]
feat = minor
fix = patch
perf = patch
refactor = patch
revert = patch
docs = none
style = none
chore = none
test = none
build = none
ci = none
version = ignore
wip = ignore
